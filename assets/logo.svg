<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2D2D"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>
  
  <!-- Hexagonal hive cells -->
  <g fill="url(#cellGrad)" opacity="0.9">
    <!-- Center cell -->
    <polygon points="200,140 252,170 252,230 200,260 148,230 148,170"/>
    <!-- Top cells -->
    <polygon points="200,80 235,100 235,140 200,160 165,140 165,100"/>
    <polygon points="148,120 183,140 183,170 148,190 113,170 113,140"/>
    <polygon points="252,120 287,140 287,170 252,190 217,170 217,140"/>
    <!-- Bottom cells -->
    <polygon points="200,260 235,280 235,320 200,340 165,320 165,280"/>
    <polygon points="148,230 183,250 183,290 148,310 113,290 113,250"/>
    <polygon points="252,230 287,250 287,290 252,310 217,290 217,250"/>
    <!-- Side cells -->
    <polygon points="113,170 148,190 148,230 113,250 78,230 78,190"/>
    <polygon points="287,170 322,190 322,230 287,250 252,230 252,190"/>
  </g>
  
  <!-- Bees -->
  <g>
    <!-- Bee 1 - Center -->
    <ellipse cx="200" cy="200" rx="20" ry="12" fill="#2D2D2D" transform="rotate(-30 200 200)"/>
    <ellipse cx="200" cy="200" rx="8" ry="12" fill="#FFD700" transform="rotate(-30 200 200)"/>
    <ellipse cx="212" cy="188" rx="6" ry="4" fill="#2D2D2D"/>
    
    <!-- Bee 2 - Top right -->
    <ellipse cx="250" cy="150" rx="15" ry="9" fill="#2D2D2D" transform="rotate(20 250 150)"/>
    <ellipse cx="250" cy="150" rx="6" ry="9" fill="#FFD700" transform="rotate(20 250 150)"/>
    <ellipse cx="258" cy="142" rx="5" ry="3" fill="#2D2D2D"/>
    
    <!-- Bee 3 - Bottom left -->
    <ellipse cx="150" cy="240" rx="15" ry="9" fill="#2D2D2D" transform="rotate(-45 150 240)"/>
    <ellipse cx="150" cy="240" rx="6" ry="9" fill="#FFD700" transform="rotate(-45 150 240)"/>
    <ellipse cx="158" cy="248" rx="5" ry="3" fill="#2D2D2D"/>
    
    <!-- Bee 4 - Small flying -->
    <ellipse cx="120" cy="160" rx="10" ry="6" fill="#2D2D2D" transform="rotate(-60 120 160)"/>
    <ellipse cx="120" cy="160" rx="4" ry="6" fill="#FFD700" transform="rotate(-60 120 160)"/>
    
    <!-- Bee 5 - Small flying -->
    <ellipse cx="280" cy="220" rx="10" ry="6" fill="#2D2D2D" transform="rotate(30 280 220)"/>
    <ellipse cx="280" cy="220" rx="4" ry="6" fill="#FFD700" transform="rotate(30 280 220)"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#2D2D2D">SKILL</text>
  <text x="200" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#2D2D2D">HIVE</text>
</svg>